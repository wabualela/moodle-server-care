# /etc/nginx/conf.d/moodle-ratelimit.conf  (nginx module, step 3; http context)
# Keys are per client address. Behind Cloudflare or any proxy, the real-IP configuration (cloudflare module, step 1)
# MUST be live first, or every visitor shares a few proxy addresses and gets limited together.
# Requests with an empty key are not counted, which is how each zone applies only to its class of requests.
# With a wwwroot sub-path (https://example.com/moodle), prefix the paths in the three maps: /moodle/index.php, etc.
# Several Moodle sites on one nginx: one copy per site with distinct variable and zone names.
geo $rl_exempt {
    default        0;
    127.0.0.1/32   1;
    ::1/128        1;
    <ORIGIN_IP>/32 1;   # this server: monitors and own curl to the public name (via Cloudflare too, after real-IP)
    # <OFFICE_IP>/32 1; # optional: admin/office static addresses, with the owner's approval
}
map $rl_exempt $rl_addr { 0 $binary_remote_addr; 1 ""; }

map $uri $rl_is_front    { default 0; /index.php 1; }   # "/" reaches the PHP location as /index.php
map $uri $rl_is_fallback { default 0; /r.php 1; }       # try_files ... /r.php (Moodle 4.5+ router fallback)
map "$request_method:$uri" $rl_is_auth {
    default 0;
    "POST:/login/index.php"           1;
    "POST:/login/signup.php"          1;
    "POST:/login/forgot_password.php" 1;
}
map $rl_is_front    $rl_key_front    { default ""; 1 $rl_addr; }
map $rl_is_fallback $rl_key_fallback { default ""; 1 $rl_addr; }
map $rl_is_auth     $rl_key_auth     { default ""; 1 $rl_addr; }

# 1 MB holds about 16,000 client states.
limit_req_zone  $rl_key_front    zone=moodle_front:10m    rate=60r/m;
limit_req_zone  $rl_key_fallback zone=moodle_fallback:10m rate=30r/m;
limit_conn_zone $rl_key_front    zone=moodle_front_conn:10m;
# Defined now, used only after the 7-day review (step 5). An unused zone costs only its shared memory.
limit_req_zone  $rl_addr         zone=moodle_php:20m      rate=20r/s;
limit_req_zone  $rl_key_auth     zone=moodle_auth:10m     rate=60r/m;

# Dedicated log of requests the limiter delayed or rejected (dry run or real).
map "$limit_req_status:$limit_conn_status" $rl_hit { default 0; "~(REJECTED|DELAYED)" 1; }
# $request_uri, not $uri: try_files rewrites $uri to the script name (/r.php, /index.php).
log_format moodle_rl '$time_iso8601 $remote_addr "$request_method $request_uri" $status '
                     'lrs=$limit_req_status lcs=$limit_conn_status ua="$http_user_agent"';
# In the Moodle server block (step 3):
#   access_log /var/log/nginx/moodle-ratelimit.log moodle_rl if=$rl_hit;
