# /etc/nginx/conf.d/00-default-server.conf for nginx OLDER than 1.19.4 (no ssl_reject_handshake).
# Port 443 needs a certificate to complete the handshake; use the local self-signed "snakeoil" pair
# (Debian/Ubuntu package ssl-cert; check the files exist first). Unknown names then see an untrusted certificate
# and an immediately closed connection. Rollback: delete the file, nginx -t, reload.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/default-reject.log;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;
    access_log /var/log/nginx/default-reject.log;
    return 444;
}
