# /etc/nginx/conf.d/moodle-static.conf  (nginx module, step 6; http context)
# Page-builder media (Edwiser local_edwiserpagebuilder) are system-context files served WITHOUT login, yet Moodle
# sends them "private, max-age=10", so every page view re-fetches them through PHP. These maps let the X-Accel
# internal location mark exactly that path public for one day. Every other file keeps Moodle's own headers.
# Only for a plugin whose pluginfile handler is verified public (nginx-discover.sh prints it); context 1 = system.
# With a wwwroot sub-path, put it in front: "~^/moodle/pluginfile\.php/1/...".
map $request_uri $moodle_pb_expires {
    default off;                                               # off = leave Moodle's headers untouched
    "~^/pluginfile\.php/1/local_edwiserpagebuilder/" 1d;
}
map $request_uri $moodle_pb_cc {
    default "";                                                # empty value = add_header adds nothing
    "~^/pluginfile\.php/1/local_edwiserpagebuilder/" "public";
}
# In the Moodle server block, the existing X-Accel location becomes (alias = $CFG->dataroot with trailing slash):
#   location /dataroot/ {
#       internal;
#       alias <DATAROOT>/;
#       expires    $moodle_pb_expires;
#       add_header Cache-Control $moodle_pb_cc;
#       # REPEAT HERE every add_header of the server/http level (nginx-discover.sh lists them), e.g.
#       # add_header Strict-Transport-Security "max-age=31536000" always;
#       # One add_header in a location turns off inheritance of ALL outer add_header lines for these responses.
#   }
