    # nginx module, step 6: browsers request /favicon.ico on their own. Without a file, the request falls through
    # try_files to r.php and boots Moodle (or 404s). Serve a static file kept OUTSIDE the Moodle tree, so upgrades
    # and git operations never touch it. Place inside the Moodle server block, before `location /`.
    location = /favicon.ico {
        alias <STATIC_DIR>/favicon.ico;    # e.g. /var/www/<site-static>/favicon.ico, mode 644
        expires 7d;
        access_log off;
        log_not_found off;
    }
