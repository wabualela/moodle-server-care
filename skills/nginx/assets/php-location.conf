    # nginx module, step 2: PHP location for Moodle with a .php existence check (replaces the existing one).
    # Keep the site's own fastcgi_pass and any extra fastcgi_param/timeouts lines; only the marked lines change.
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;   # non-greedy (Debian's own split). Greedy ^(.+\.php)(/.+)$ breaks
                                                     # "/dir.php/file" inside pluginfile paths and "/login/index.php/".
        # try_files resets $fastcgi_path_info (nginx trac #321): save it first and pass the saved copy as PATH_INFO.
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;         # unknown .php -> nginx 404, PHP-FPM never sees it

        # --- step 3 (rate limits, DRY RUN): insert the lines from assets/php-location-ratelimit.lines here ---

        fastcgi_index index.php;
        fastcgi_pass unix:<FPM_SOCK>;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;          # was $fastcgi_path_info: empty after try_files -> no CSS/JS/images
    }
