    # nginx module, step 2: common scanner probes answered by nginx without starting PHP or Moodle.
    # Place INSIDE the Moodle server block and BEFORE the PHP location: regex locations are tried in file order.
    # Every prefix was checked against the docroot and Moodle's route paths by nginx-discover.sh; remove any
    # prefix that collides on this server. Never add /api/ (Moodle 5 REST routes) or admin/tool/installaddon.
    location ~* ^/(wp-admin|wp-content|wp-includes|wp-json|minio|nifi-api|swagger|swagger-ui|api-docs|actuator|cgi-bin|phpmyadmin|pma|telescope|_debugbar|vendor/phpunit|boaform|HNAP1)(/|$) {
        return 404;
    }
