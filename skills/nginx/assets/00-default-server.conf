# /etc/nginx/conf.d/00-default-server.conf  (nginx module, step 1; nginx >= 1.19.4)
# A request whose Host header (port 80) or TLS SNI (port 443) matches no configured server_name is refused.
# Without this, nginx answers unknown names, wildcard DNS names and the bare IP with the FIRST server block for
# that port (file order), i.e. some unrelated site, with its certificate.
# Rollback: delete this file, `sudo nginx -t && sudo systemctl reload nginx`.
#
# Before installing: no other server may already carry `default_server` on these ports (nginx-discover.sh).
# Keep the [::] lines only if other servers listen on IPv6 too ([::]:80 / [::]:443); nginx -t does not bind
# sockets, so a missing IPv6 stack shows up only at reload (the old configuration then stays active).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/default-reject.log;   # who probes unknown names (rotated by the nginx logrotate glob)
    return 444;                                     # close the connection without an answer
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;   # no certificate needed; the TLS handshake fails, so no request is ever logged here
}
