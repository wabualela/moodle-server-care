# moodle-server-care / hygiene H3/H4 — Moodle cron logs written by the web user's crontab redirections.
# Install as /etc/logrotate.d/moodle_cron (root:root 644) if no stanza covers the directory yet.
# cron reopens the file by name on every run (>>), so no copytruncate is needed.
# "create" keeps rotated files 640 <WEBUSER>:<WEBUSER>; without it they come back with the old (often 644) mode.
/var/log/moodle_cron/*.log {
	daily
	rotate 30
	missingok
	notifempty
	compress
	delaycompress
	create 0640 <WEBUSER> <WEBUSER>
}
