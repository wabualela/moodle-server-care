# moodle-server-care / hygiene H8 — MariaDB socket activation: TCP on loopback only.
# Install as /etc/systemd/system/mariadb.socket.d/10-localhost-only.conf, then daemon-reload and
# stop mariadb.service mariadb.socket && start mariadb.socket mariadb.service (never restart the socket alone).
# Why: the packaged mariadb.socket has ListenStream=3306 (all addresses) and, under socket activation, mariadbd
# ignores bind-address. The empty ListenStream= resets the packaged list; the next lines re-add what Moodle and
# local tools use. Compare the paths with `systemctl cat mariadb.socket` on the server before installing.
[Socket]
ListenStream=
ListenStream=@mariadb
ListenStream=/run/mysqld/mysqld.sock
ListenStream=127.0.0.1:3306
