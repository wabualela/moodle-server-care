# moodle-server-care / hygiene H2 — stanza for a log that no other stanza claims (example: a PHP-FPM slow log).
# Install as /etc/logrotate.d/<name> (root:root 644; logrotate refuses group/world-writable configs).
# Check first that no package stanza already covers the path (bash scripts/logrotate-check.sh): two stanzas for one
# file make every logrotate run fail.
# copytruncate: the writer keeps the file open and is not signalled; a few lines can be lost at rotation time.
# If the writer can reopen its logs, use "create 0640 <owner> <group>" plus a postrotate signal instead.
<LOG_PATH> {
	weekly
	rotate 12
	missingok
	notifempty
	compress
	delaycompress
	copytruncate
}
