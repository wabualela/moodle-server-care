# /etc/nginx/conf.d/perf-logformat.conf  (moodle-server-care, audit module)
# The standard "combined" format plus the request time and the upstream (PHP) time at the end, so every combined-log
# tool still works and the audit scripts can measure server time per request:
#   rt  = $request_time            seconds from the first byte read to the last byte sent (includes sending)
#   urt = $upstream_response_time  seconds PHP-FPM took ("-" when nginx answered by itself)
# Use it in the site's server block:  access_log /var/log/nginx/<site>-access.log perf;
# Then: nginx -t && systemctl reload nginx   (back up the vhost first; see references/observability.md section 1)
log_format perf '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                'rt=$request_time urt=$upstream_response_time';
